services:
  - type: web
    name: dsa-tracker-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_ORIGIN
        value: https://dsclassmate.netlify.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
